    - name: "Select Star"
      logo: "selectstar-logo.png"
    - name: "semantido"
      logo: "semantido-logo.png"
      details:
        description: "semantido is an open-source Python semantic layer for SQLAlchemy. Semantic metadata is authored next to the models it describes, and exported to Apache Ossie YAML deterministically."
        features:
          - title: "Export to Ossie"
            description: "Convert a semantido semantic layer to Ossie YAML with to_ossie_yaml(), including the concept registry as vendor extensions. The authoring surface is stable and it tracks the Ossie spec."
            url: "https://semantido.ai/guides/ossie/"
            url_label: "Documentation"
          - title: "Concept registry and lint"
            description: "A concept tier above the physical schema, with static checks that reject grain-mismatched and homonym-conflating joins before they reach an agent."
            url: "https://semantido.ai/guides/concept-registry/"
            url_label: "Documentation"
          - title: "semantido on GitHub"
            description: "Open-source semantic layer for the agentic analytics era. Apache-2.0 licensed."
            url: "https://github.com/hikarilabs/semantido"
            url_label: "View on GitHub"
