      details:
        description: "Veezoo is an agentic analytics solution engineered for trust. At its core is a knowledge graph semantic layer, and Veezoo supports Apache Ossie (Incubating) natively as a source for it."
        features:
          - title: "Native Ossie import"
            description: "Ossie documents import directly into the knowledge graph: a class per entity with its dimensions, the joins between entities, and a measure per metric."
