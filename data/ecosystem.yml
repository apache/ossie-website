    - name: "Iqea Technologies Inc."
      logo: "iqea-logo.svg"
      details:
        description: "Iqea builds the Apache Ossie (Incubating) reference implementation for DuckDB. It reads Ossie semantic models in YAML or JSON and answers semantic queries directly against tables in DuckDB, planning the joins and deriving the grain from declared keys before emitting SQL that DuckDB executes, rather than converting models into another vendor's format."
        features:
          - title: "duckdb-ossie"
            description: "A DuckDB community extension that executes Ossie semantic models."
            url: "https://duckdb.org/community_extensions/extensions/ossie"
            url_label: "See Details"
          - title: "Source and documentation"
            description: "The compiler, its conformance fixtures, and the limitations it documents."
            url: "https://github.com/iqea-ai/duckdb-ossie"
            url_label: "View on GitHub"
          - title: "Serve a model over MCP"
            description: "Publish metrics and dimensions so an AI agent can discover names and query them."
            url: "https://github.com/iqea-ai/duckdb-ossie/blob/main/examples/server.sql"
            url_label: "View on GitHub"
