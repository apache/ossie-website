        description: "Databricks is committed to Apache Ossie (Incubating)'s vision of portable, vendor-agnostic business semantics. Based on its experience building metric views, Databricks believes open standards such as Ossie and SQL should be the common language for AI and BI."
        features:
          - title: "Metric view to Ossie converter"
            description: "Export a Databricks metric view to an Ossie model. Maintained in the Ossie converters repository."
