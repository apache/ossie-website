      logo: "holistics-logo.svg"
      details:
        description: "Holistics supports Apache Ossie (Incubating) and its vendor-neutral specification. Its semantic layer is written as code in AML, covering datasets, models, dimensions, measures and relationships, and converts both ways with Ossie so a model can move between the two. Anything the other side cannot hold is reported as a structured issue rather than dropped silently."
        features:
          - title: "Holistics AML converter"
            description: "The bidirectional Ossie converter, maintained in the Ossie converters repository."
            url: "https://github.com/apache/ossie-converters/tree/main/holistics"
            url_label: "View on GitHub"
    - name: "Honeydew"
      logo: "honeydew-logo.png"
      details:
        description: "Honeydew actively supports Apache Ossie (Incubating) and its open, vendor-neutral specification. Its semantic layer is YAML-based and git-native, and converts bidirectionally with Ossie so metrics, attributes and relationships stay portable across BI tools, AI agents and warehouses."
        features:
          - title: "Honeydew Converter"
            description: "The bidirectional Ossie converter, maintained in the Ossie converters repository."
