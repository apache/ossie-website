      details:
        description: "Saiku is an open-source semantic layer that lets BI users, Excel, and AI agents query Ossie semantic models without writing SQL."
        features:
          - title: "Ossie AI Query API"
            description: "Typed REST and MCP surface to list, describe, and query Ossie models, with self-correcting validation errors so agents never write SQL."
            url: "https://github.com/spiculedata/saiku/blob/development/docs/AI-OSSIE-API.md"
            url_label: "Documentation"
          - title: "Natural-language ask over Ossie"
            description: "Ask a question in plain language and Saiku composes a governed Ossie query the model cannot turn into free-form SQL."
            url: "https://github.com/spiculedata/saiku/blob/development/docs/AI-OSSIE-API.md"
            url_label: "Documentation"
          - title: "Saiku on GitHub"
            description: "Open-source Mondrian and Calcite semantic layer with dashboards, Excel and XMLA, and MCP for agents."
            url: "https://github.com/spiculedata/saiku"
            url_label: "View on GitHub"
