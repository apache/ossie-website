# =============================================================================
# Community Page Content
# =============================================================================
# Drives the Community page (docs/community.md).
# Edit this file to update get-involved links, the community meeting, and
# working groups.
# =============================================================================

community_page:
  # Shared community Google Calendar. This is the source of truth for all
  # meeting times, so every "schedule" link on the page points here.
  calendar_url: "https://calendar.google.com/calendar/u/0?cid=YTM0ZjAxM2U4ZDhmOWNkYTQxOWM2NmFmODlhYjQ3NDg4NjQ0ZDczNWZkZmUzYjBjYjJjZWQ5MGE4ODBhMmE5NUBncm91cC5jYWxlbmRhci5nb29nbGUuY29t"

  get_involved:
    heading: "Get Involved"
    description: >-
      Join our open-source community on GitHub, the mailing lists, or Slack.
      Help shape the future of semantic interchange.
    links:
      - label: "View Repository"
        url: "https://github.com/apache/ossie"
        description: "Browse the spec, raise PRs, and contribute code."
      - label: "Start a Discussion"
        url: "https://github.com/apache/ossie/discussions"
        description: "Share ideas, propose features, and ask questions."
      - label: "Join Slack"
        url: "https://join.slack.com/t/apache-ossie/shared_invite/zt-42zw4rflt-Gpve8_NFJq7AsdAQTY~SCg"
        description: "Chat directly with contributors on Slack."
      - label: "Subscribe to dev@"
        url: "mailto:dev-subscribe@ossie.apache.org"
        description: "Main development and community discussion list."
      - label: "Subscribe to commits@"
        url: "mailto:commits-subscribe@ossie.apache.org"
        description: "Automated notifications for commits and pull requests."
      - label: "Subscribe to issues@"
        url: "mailto:issues-subscribe@ossie.apache.org"
        description: "Automated notifications for GitHub issues."
      - label: "Google Calendar"
        url: "https://calendar.google.com/calendar/u/0?cid=YTM0ZjAxM2U4ZDhmOWNkYTQxOWM2NmFmODlhYjQ3NDg4NjQ0ZDczNWZkZmUzYjBjYjJjZWQ5MGE4ODBhMmE5NUBncm91cC5jYWxlbmRhci5nb29nbGUuY29t"
        description: "Subscribe to community meetings and events."

  # Recurring meetings, rendered as cards. `type` drives the label: a
  # "working_group" entry gets " Working Group" appended to its name; a
  # "community" entry shows its name as-is. Add a new recurring meeting by
  # appending an entry here — no template change needed.
  meetings:
    heading: "Meetings and Working Groups"
    # Keep this key as "entries", not "items": Jinja resolves `.items` to the
    # dict's built-in method, so an "items" key would be shadowed.
    entries:
      - name: "Community Meeting"
        type: "community"
        focus: "Project-wide updates and discussions"
        schedule: "Last Monday of each month · 9:30–10:30am PST"
        vc_url: "https://meet.google.com/wmk-uodp-pxy"
        notes_url: "https://docs.google.com/document/d/18lgmRAB4OOtVUPmQ5fFVpxqFS1oXRgQJTceZ0A_v8pw/edit?tab=t.0#heading=h.zgpqdat5gr0p"
      - name: "Metrics and Querying"
        type: "working_group"
        focus: "Defining portable model representations and query semantics"
        schedule: "Alternating Wednesdays · 9:00am PST (from Mar 25, 2026) · 4:00pm PST (from Apr 1, 2026)"
        vc_url: "https://meet.google.com/nkp-qdpn-vyr"
        notes_url: "https://docs.google.com/document/d/1J4MvDvdMsOGB9DQXUpco_iN8E5Forrt5oZppJZTKB7k/edit?tab=t.0#heading=h.toksa7exn8pl"
        slack_url: "https://apache-ossie.slack.com/archives/C0ADR49SBEK"
      - name: "Catalog Integration"
        type: "working_group"
        focus: "Bridging Apache Ossie models with data catalog and governance platforms"
        schedule: "Monthly on the 24th · 9:30–10:30am PST"
        vc_url: "https://meet.google.com/wib-nhtq-mtf"
        slack_url: "https://apache-ossie.slack.com/archives/C0B8N5VQG1Y"
      - name: "Ontology Representation"
        type: "working_group"
        focus: "Mapping Apache Ossie concepts to formal ontology standards"
        schedule: "Every 2 weeks on Tuesday · 10:00–10:30am PST (from Sep 1, 2026)"
        vc_url: "https://relationalai.zoom.us/j/98467672408?pwd=UoVS6GHfSssQHtNUvdBQEPdZFt4Sut.1"
        notes_url: "https://docs.google.com/document/d/1u4DYy6_0U-YwRHLgHi-cOCUfvCp1RMB7iZNN_HZP0YE/edit?tab=t.0#heading=h.vgq6gsk6el5e"
        slack_url: "https://apache-ossie.slack.com/archives/C0ACQJVFVRN"
