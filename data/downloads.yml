# =============================================================================
# Downloads Page Content
# =============================================================================
# Drives the Downloads page (docs/downloads.md).
# When a release is published, add an entry under `releases`. Until there is
# at least one release, the page shows `empty_message`.
# =============================================================================

downloads_page:
  heading: "Downloads"
  empty_message: "No release yet."

  # KEYS file used to verify release signatures.
  keys_url: "https://downloads.apache.org/incubator/ossie/KEYS"

  # Releases, newest first. Example entry:
  #
  #   - version: "0.1.0-incubating"
  #     date: "2027-01-15"
  #     source: "https://www.apache.org/dyn/closer.lua/incubator/ossie/0.1.0-incubating/apache-ossie-0.1.0-incubating-src.tar.gz"
  #     signature: "https://downloads.apache.org/incubator/ossie/0.1.0-incubating/apache-ossie-0.1.0-incubating-src.tar.gz.asc"
  #     checksum: "https://downloads.apache.org/incubator/ossie/0.1.0-incubating/apache-ossie-0.1.0-incubating-src.tar.gz.sha512"
  #     notes_url: "https://github.com/apache/ossie/releases/tag/v0.1.0-incubating"
  releases: []
